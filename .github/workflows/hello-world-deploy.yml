name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'bots/hello-world/**'
      - '.github/workflows/hello-world-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: bots/hello-world

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the code
        run: npm run build

      - name: Zip the build output
        run: zip -j function.zip dist/index.js

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::024681370708:role/github-scribble-pub
          aws-region: eu-north-1

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name scribble-pub-hello-world-bot \
            --zip-file fileb://function.zip
